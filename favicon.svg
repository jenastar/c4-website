<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a73e8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4285f4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34a853;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Rounded background -->
  <rect width="128" height="128" rx="24" fill="url(#bgGradient)" />

  <!-- Subtle geometric pattern -->
  <path d="M 0 64 L 32 48 L 32 80 Z" fill="white" opacity="0.05" />
  <path d="M 96 48 L 128 64 L 96 80 Z" fill="white" opacity="0.05" />

  <!-- C letter -->
  <path d="M 40 64 C 40 48.5 48.5 40 64 40 C 72 40 78 43 82 48"
        stroke="white"
        stroke-width="10"
        stroke-linecap="round"
        fill="none" />
  <path d="M 40 64 C 40 79.5 48.5 88 64 88 C 72 88 78 85 82 80"
        stroke="white"
        stroke-width="10"
        stroke-linecap="round"
        fill="none" />

  <!-- 4 number with subtle shadow -->
  <path d="M 91 52 L 91 76 M 91 64 L 105 64 M 105 44 L 105 88"
        stroke="rgba(0,0,0,0.2)"
        stroke-width="10"
        stroke-linecap="round"
        transform="translate(1, 1)" />
  <path d="M 91 52 L 91 76 M 91 64 L 105 64 M 105 44 L 105 88"
        stroke="white"
        stroke-width="10"
        stroke-linecap="round" />
</svg>
